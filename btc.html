<!DOCTYPE html>
<html>
<head>
    <title>My Bank - Bitcoin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background-color: #f0f2f5;
            color: #1a1a1a;
        }
        .header {
            background: linear-gradient(135deg, #f7931a, #e67e00);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .back { font-size: 22px; cursor: pointer; }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .btc-balance { text-align: center; margin-bottom: 8px; }
        .btc-amount {
            font-size: 36px;
            font-weight: 700;
            color: #f7931a;
        }
        .btc-value {
            font-size: 18px;
            color: #666;
            margin-top: 4px;
        }
        .price-info {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eee;
            font-size: 14px;
        }
        .price-up { color: #00a651; }
        .price-down { color
