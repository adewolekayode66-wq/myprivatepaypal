<!DOCTYPE html>
<html>
<head>
    <title>My Bank - Cards</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #f0f2f5; }
        .header {
            background: linear-gradient(135deg, #0070ba, #003087);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .back { font-size: 22px; cursor: pointer; }
        .container { max-width: 480px; margin: 0 auto; padding: 20px 16px; }
        .card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .card-type { font-size: 14px; opacity: 0.8; }
        .card-number { font-size: 22px; letter-spacing: 3px; margin: 20px 0; }
        .card-bottom { display: flex; justify-content: space-between; font-size: 14px; }
        .section-title { font-size: 16px; font-weight: 600; margin: 24px 0 12px; }
        .action-btn {
            background: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 10px;
            font-size: 15px;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="back" onclick="window.location.href='dashboard.html'">←</div>
        <h1>Cards</h1>
    </div>
    <div class="container">
        <div class="card">
            <div class="card-type">Debit Card</div>
            <div class="card-number">•••• •••• •••• 4582</div>
            <div class="card-bottom">
                <div>
                    <div style="opacity:0.7; font-size:12px;">Card Holder</div>
                    <div>Annie Thompson</div>
                </div>
                <div>
                    <div style="opacity:0.7; font-size:12px;">Expires</div>
                    <div>09/28</div>
                </div
